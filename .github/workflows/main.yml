name: Quick Learning Loop (5 min)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes

jobs:
  quick-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 7  # 7 minutes max (5 min loop + buffer)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run 5-minute learning loop
      run: python quick_loop.py
      continue-on-error: true
    
    - name: Generate trades
      run: python trade_generator.py
      continue-on-error: true
    
    - name: Generate dashboard
      run: python dashboard_generator.py
      continue-on-error: true
    
    - name: Commit state and dashboard
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add state/ index.html nifty500_broom_breakout_results.csv
        git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
        git push || echo "Push failed"
    
    - name: Deploy dashboard
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        enable_jekyll: false
