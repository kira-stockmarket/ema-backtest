name: Continuous Learning Loop

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  push:
    branches:
      - main
    paths:
      - 'quick_loop.py'
      - 'trade_generator.py'
      - 'dashboard_generator.py'
      - 'requirements.txt'

permissions:
  contents: write  # Allow pushing commits
  pages: write      # Allow GitHub Pages deployment
  id-token: write   # For Pages deployment

jobs:
  learning-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # 8 minutes max (4.5 min loop + buffer)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests
    
    - name: Create directories
      run: |
        mkdir -p state logs data_cache results
    
    - name: Run learning loop
      run: python quick_loop.py
      continue-on-error: true
    
    - name: Generate trade signals
      run: python trade_generator.py
      continue-on-error: true
    
    - name: Generate dashboard
      run: python dashboard_generator.py
      continue-on-error: true
    
    - name: Commit state and results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Force add all important files (even if in .gitignore)
        git add -f state/current_params.json
        git add -f state/all_trades.json
        git add -f state/learning_progress.json
        git add -f nifty500_broom_breakout_results.csv
        git add -f index.html
        
        # Commit if there are changes
        git commit -m "🔄 Auto-update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        
        # Push changes
        git push origin main || echo "Push failed"
      continue-on-error: true
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        enable_jekyll: false
        force_orphan: true
        exclude_assets: '.github,state,logs,data_cache,results'
      continue-on-error: true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: learning-state
        path: |
          state/current_params.json
          state/all_trades.json
          state/learning_progress.json
          nifty500_broom_breakout_results.csv
          index.html
        retention-days: 7
      continue-on-error: true
    
    - name: Summary
      run: |
        echo "## Learning Loop Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "state/current_params.json" ]; then
          echo "### Current Parameters:" >> $GITHUB_STEP_SUMMARY
          cat state/current_params.json >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "nifty500_broom_breakout_results.csv" ]; then
          echo "### Trade Signals:" >> $GITHUB_STEP_SUMMARY
          echo '```csv' >> $GITHUB_STEP_SUMMARY
          head -20 nifty500_broom_breakout_results.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
