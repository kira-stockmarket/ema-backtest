name: Continuous Learning + Trade Generation

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  push:
    branches:
      - main

jobs:
  learn-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5.8 hours
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Download previous learning state
      uses: actions/download-artifact@v4
      with:
        name: learning-state
        path: state/
      continue-on-error: true
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run learning loop
      run: python learning_loop.py
      continue-on-error: true
    
    - name: Generate trades
      run: python trade_generator.py
      continue-on-error: true
    
    - name: Generate dashboard
      run: python dashboard_generator.py
      continue-on-error: true
    
    - name: Upload learning state
      uses: actions/upload-artifact@v4
      with:
        name: learning-state
        path: state/
        retention-days: 7
    
    - name: Upload trade signals
      uses: actions/upload-artifact@v4
      with:
        name: trade-signals
        path: |
          nifty500_broom_breakout_results.csv
          index.html
        retention-days: 30
    
    - name: Commit dashboard to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html nifty500_broom_breakout_results.csv
        git commit -m "Update dashboard and trades [skip ci]" || echo "No changes to commit"
        git push || echo "Push failed"
    
    - name: Enable GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        enable_jekyll: false
