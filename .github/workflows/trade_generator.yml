name: Live Trade Generator & Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests
    
    - name: Generate trade signals
      run: python trade_generator.py
      continue-on-error: true
    
    - name: Generate dashboard
      run: python dashboard_generator.py
      continue-on-error: true
    
    - name: Commit Dashboard Updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add -f nifty500_broom_breakout_results.csv
        git add -f index.html
        
        git commit -m "📊 Dashboard Update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
        
        # Sync with remote branch to grab the AI's latest parameter commits
        git pull origin main --rebase
        
        # Now push the dashboard
        git push origin main || echo "Push failed"
      continue-on-error: true
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        enable_jekyll: false
        force_orphan: true
      continue-on-error: true
