name: Live Trade Generator & Paper Trader

on:
  workflow_dispatch:  # Allows you to trigger it manually
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes automatically

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch all history so rebasing works smoothly
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests
    
    - name: Generate trade signals
      run: python trade_generator.py
      continue-on-error: true
    
    - name: Generate dashboard
      run: python dashboard_generator.py
      continue-on-error: true
      
    - name: Run Paper Trading Terminal
      run: python paper_trader.py
      continue-on-error: true
    
    - name: Commit Data & Dashboard Updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add generated files (using || true so it doesn't crash if they don't exist yet)
        git add -f nifty500_broom_breakout_results.csv || true
        git add -f index.html || true
        git add -f state/paper_portfolio.json || true
        git add -f paper_trade_history.csv || true
        
        # Commit if there are changes
        git commit -m "📊 Dashboard & Portfolio Update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        
        # Sync with remote branch to grab the AI's latest parameter commits
        git pull origin main --rebase
        
        # Push all updates
        git push origin main || echo "Push failed"
      continue-on-error: true
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        enable_jekyll: false
        force_orphan: true
        exclude_assets: '.github,logs,data_cache,results'
      continue-on-error: true
