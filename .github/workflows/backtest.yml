name: Nifty 500 Broom Breakout Backtest

on:
  # Run manually from GitHub UI
  workflow_dispatch:
    inputs:
      universe_size:
        description: 'Number of stocks to process (default: 20)'
        required: false
        default: '20'
        type: string
      batch_size:
        description: 'Batch size for processing (default: 5)'
        required: false
        default: '5'
        type: string
      
  # Schedule: Run every Sunday at 1:30 AM IST (Sunday 8:00 PM UTC previous day)
  schedule:
    - cron: '0 20 * * 6'  # Saturday 8:00 PM UTC = Sunday 1:30 AM IST
    
  # Run on push to main branch (optional)
  push:
    branches:
      - main
    paths:
      - 'strategy.py'
      - 'requirements.txt'
      - '.github/workflows/backtest.yml'

env:
  PYTHON_VERSION: '3.10'
  ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache stock data
      uses: actions/cache@v4
      with:
        path: data_cache
        key: ${{ runner.os }}-stock-data-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-stock-data-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify installation
      run: |
        python -c "import pandas, numpy, yfinance, requests; print('Dependencies installed successfully')"
    
    - name: Create output directory
      run: mkdir -p results logs data_cache
    
    - name: Run backtest
      env:
        UNIVERSE_SIZE: ${{ github.event.inputs.universe_size || '20' }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        GITHUB_ACTIONS: 'true'
      run: |
        echo "Starting backtest with universe size: $UNIVERSE_SIZE, batch size: $BATCH_SIZE"
        python strategy.py
      continue-on-error: true
    
    - name: Check results
      run: |
        if [ -f "nifty500_broom_breakout_results.csv" ]; then
          echo "✅ Backtest results generated successfully"
          head -20 nifty500_broom_breakout_results.csv
        else
          echo "❌ No results file generated"
          exit 1
        fi
    
    - name: Upload backtest results
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results-${{ github.run_id }}
        path: |
          nifty500_broom_breakout_results.csv
          backtest.log
        retention-days: 90
        compression-level: 6
    
    - name: Upload results as release asset
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: backtest-${{ github.run_id }}
        name: Backtest Results - ${{ github.run_id }}
        files: |
          nifty500_broom_breakout_results.csv
          backtest.log
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create summary
      if: always()
      run: |
        echo "## Backtest Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "### Date: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "nifty500_broom_breakout_results.csv" ]; then
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo '```csv' >> $GITHUB_STEP_SUMMARY
          head -20 nifty500_broom_breakout_results.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ No results generated" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Backtest Failed - Run ID: ${context.runId}`,
            body: `The backtest failed. Check the logs for more details.\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}`,
            labels: ['bug', 'automated']
          });

## 3. GitHub Actions Workflow for Scheduled Runs (.github/workflows/scheduled-backtest.yml)

```yaml
name: Scheduled Nifty 500 Backtest

on:
  schedule:
    # Run every Sunday at 1:30 AM IST (Saturday 8:00 PM UTC)
    - cron: '0 20 * * 6'
    
    # Also run on the 1st of every month at 2:00 AM IST
    - cron: '30 20 * * 0'

env:
  PYTHON_VERSION: '3.10'

jobs:
  scheduled-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 12 hours for full universe
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run full Nifty 500 backtest
      env:
        FULL_UNIVERSE: 'true'
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        GITHUB_ACTIONS: 'true'
      run: |
        echo "Running full Nifty 500 backtest"
        python strategy.py
      continue-on-error: true
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: full-universe-results-${{ github.run_id }}
        path: |
          nifty500_broom_breakout_results.csv
          backtest.log
        retention-days: 365
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: weekly-backtest-${{ github.run_id }}
        name: Weekly Backtest Results - $(date +'%Y-%m-%d')
        body: |
          # Weekly Nifty 500 Backtest Results
          
          Run ID: ${{ github.run_id }}
          Date: $(date +'%Y-%m-%d %H:%M:%S')
          
          ## Results Summary
          Check the attached CSV file for detailed results.
        files: |
          nifty500_broom_breakout_results.csv
          backtest.log
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

## 4. README.md

```markdown
# Nifty 500 Broom Breakout Strategy Backtesting Engine

A sophisticated quantitative backtesting engine for the Institutional Moving Average "Broom" Breakout strategy, specifically designed for the Nifty 500 universe.

## Strategy Overview

### The "Broom Setup"

The strategy identifies stocks in a specific consolidation pattern characterized by:

1. **Macro Trend Filter**: Price above Weekly and Monthly 200 EMA
2. **EMA Broom Compression**: Daily EMAs (20, 50, 100, 200) converging within 8%
3. **Base Duration**: Peak within 3-7 months (63-147 trading days)
4. **Flat Box Consolidation**: 20-day range less than 15%
5. **Prior Trend Exhaustion**: Run-up before base not exceeding 60%

### Entry Criteria

- Close above highest daily EMA
- Close above Volume Profile POC (10-bin, 20-day)
- Volume > 1.5x 50-day average

### Risk Management

- **Stop Loss**: 200 EMA × 0.985 (trailing)
- **Take Profit**: Entry + 2× Base Depth (measured move)

## Installation

### Prerequisites

- Python 3.9+
- Git
- GitHub account (for automated runs)

### Local Setup

