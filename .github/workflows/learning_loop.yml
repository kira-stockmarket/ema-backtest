name: 5.8H Continuous Learning Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs once daily at midnight UTC

permissions:
  contents: write

jobs:
  learning-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests
    
    - name: Create directories
      run: mkdir -p state logs data_cache results
    
    - name: Run 5.8 Hour Learning Loop
      run: python quick_loop.py
